name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_SLUG: one-o-eight-cafe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-fund

      - name: Build static export
        run: npm run build

      - name: Fix image paths for GitHub Pages
        run: |
          SLUG="one-o-eight-cafe"
          echo "Patching image paths for /$SLUG/..."
          # Fix url('/images/...) and url("/images/...) in JS bundles
          find out/_next -name "*.js" -type f | while read f; do
            sed -i "s|url('/images/|url('/$SLUG/images/|g" "$f"
            sed -i 's|url("/images/|url("/'"one-o-eight-cafe"'/images/|g' "$f"
            sed -i "s|url(/images/|url(/$SLUG/images/|g" "$f"
          done
          # Fix src="/images/ in HTML files
          find out -name "*.html" -type f | while read f; do
            sed -i "s|src=\"/images/|src=\"/$SLUG/images/|g" "$f"
            sed -i "s|href=\"/images/|href=\"/$SLUG/images/|g" "$f"
          done
          echo "Done patching."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
